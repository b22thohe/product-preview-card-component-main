<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main>
    <div class="flex-container">
      <div class="flex-image">
        <picture>
          <source media="(max-width: 599px)" srcset="images/image-product-mobile.jpg">
          <img class="product-image" src="images/image-product-desktop.jpg" alt="Product Image">
        </picture>
      </div>
      <div class="card-content">
        <div class="card-content__inner">
          <p class="product-category">Perfume</p>
          <h1>Gabrielle Essence Eau De Parfum</h1>
          <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.</p>
          <div class="price">
            <p class="product-price">$149.99</p>
            <p class="product-prev-price">$169.99</p>
          </div>
          <button type="button" class="btn">
            <img src="images/icon-cart.svg" alt="cart" aria-hidden="true">
            <span>Add to Cart</span>
          </button>
      </div>
    </div>
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded with <span class="attribution-heart">&hearts;</span> by <a href="https://codingsteps.online">Thomas Helsing</a>.
  </div>
</body>
</html>
